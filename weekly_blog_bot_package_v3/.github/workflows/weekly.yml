name: Weekly Blog Bot

on:
  workflow_dispatch:
    inputs:
      order:
        description: '명령 트리거 (예: "블 (민+가+행) 7 ㄱㄱ" / "draft 콘텐츠 3 길이 풀+요약+핵심"). 비우면 기본 spec 모드.'
        type: string
        default: ""
      dry_run:
        description: "true면 API/Calendar 호출 없이 sample report만 생성"
        type: boolean
        default: false
      no_calendar:
        description: "true면 Calendar 읽기/쓰기 비활성화"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: weekly-blog-bot
  cancel-in-progress: false

jobs:
  weekly:
    name: weekly run
    runs-on: ubuntu-latest
    # 명령 봇 모델: workflow_dispatch만 정상 경로. cron 자동 실행은 제거됨.
    defaults:
      run:
        working-directory: weekly_blog_bot_package_v3
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
      GOOGLE_CLIENT_SECRET_JSON: ${{ secrets.GOOGLE_CLIENT_SECRET_JSON }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
      ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: weekly_blog_bot_package_v3/requirements.txt

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Compile
        run: |
          python -m py_compile weekly_blog_bot.py
          python -c "import weekly_blog_bot; print('package ok')"

      - name: Unit tests (fast gate)
        run: python -m pytest tests/unit/ -q

      - name: Integration tests
        run: python -m pytest tests/integration/ -q

      - name: Validate configured models (live runs only)
        if: ${{ inputs.dry_run != true }}
        run: python weekly_blog_bot.py --config config/weekly_blog_bot.yaml --validate-models --no-calendar

      - name: Run weekly bot
        env:
          # 명령 트리거를 env로 전달해 쉘 인자 분해/인젝션을 차단한다.
          ORDER: ${{ inputs.order }}
          DRY_RUN: ${{ inputs.dry_run }}
          NO_CALENDAR: ${{ inputs.no_calendar }}
        run: |
          ARGS=("--config" "config/weekly_blog_bot.yaml")
          [ "$DRY_RUN" = "true" ] && ARGS+=("--dry-run")
          [ "$NO_CALENDAR" = "true" ] && ARGS+=("--no-calendar")
          [ -n "$ORDER" ] && ARGS+=("--order" "$ORDER")
          python weekly_blog_bot.py "${ARGS[@]}"

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report-${{ github.run_id }}
          path: weekly_blog_bot_package_v3/outputs/
          retention-days: 30
          if-no-files-found: warn
