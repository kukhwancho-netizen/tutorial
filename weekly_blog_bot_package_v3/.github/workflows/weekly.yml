name: Weekly Blog Bot

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true면 API/Calendar 호출 없이 sample report만 생성"
        type: boolean
        default: false
      no_calendar:
        description: "true면 Calendar 읽기/쓰기 비활성화"
        type: boolean
        default: false
  schedule:
    # GitHub Actions cron은 UTC 기준이다. KST는 DST가 없다.
    # Monday 08:30 KST = Sunday 23:30 UTC
    - cron: "30 23 * * 0"

permissions:
  contents: read

concurrency:
  group: weekly-blog-bot
  cancel-in-progress: false

jobs:
  weekly:
    name: weekly run
    runs-on: ubuntu-latest
    # cron에서는 vars.ENABLE_WEEKLY_CRON=='true'일 때만 실행한다.
    # workflow_dispatch는 이 게이트를 무시한다.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.ENABLE_WEEKLY_CRON == 'true' }}
    defaults:
      run:
        working-directory: weekly_blog_bot_package_v3
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
      GOOGLE_CLIENT_SECRET_JSON: ${{ secrets.GOOGLE_CLIENT_SECRET_JSON }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
      ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: weekly_blog_bot_package_v3/requirements.txt

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Compile
        run: |
          python -m py_compile weekly_blog_bot.py
          python -c "import weekly_blog_bot; print('package ok')"

      - name: Unit tests (fast gate)
        run: python -m pytest tests/unit/ -q

      - name: Integration tests
        run: python -m pytest tests/integration/ -q

      - name: Validate configured models (live runs only)
        if: ${{ inputs.dry_run != true }}
        run: python weekly_blog_bot.py --config config/weekly_blog_bot.yaml --validate-models --no-calendar

      - name: Run weekly bot
        run: |
          ARGS="--config config/weekly_blog_bot.yaml"
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.no_calendar }}" = "true" ]; then ARGS="$ARGS --no-calendar"; fi
          python weekly_blog_bot.py $ARGS

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report-${{ github.run_id }}
          path: weekly_blog_bot_package_v3/outputs/
          retention-days: 30
          if-no-files-found: warn
